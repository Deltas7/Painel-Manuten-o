<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel da Manutenção</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 350px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #333333; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        .error-msg { color: red; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Entrar no Painel</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="E-mail institucional" required>
            <input type="password" id="password" placeholder="Sua Senha" required>
            <button type="submit">Acessar Sistema</button>
        </form>
        <div id="mensagemErro" class="error-msg"></div>
    </div>

    <script>
        // Configure suas chaves aqui também
        const supabaseUrl = 'SUA_URL_DO_SUPABASE_AQUI'
        const supabaseKey = 'SUA_CHAVE_ANON_AQUI'
        const supabase = supabase.createClient(supabaseUrl, supabaseKey)

        const loginForm = document.getElementById('loginForm')
        const mensagemErro = document.getElementById('mensagemErro')

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault() // Impede a página de recarregar
            
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            
            // Tenta fazer o login no Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            })

            if (error) {
                mensagemErro.innerText = "Usuário ou senha incorretos."
                mensagemErro.style.display = 'block'
            } else {
                // Se o login der certo, joga o usuário para a tela inicial (index.html)
                window.location.href = 'index.html'
            }
        })
    </script>
</body>
</html>
