<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Relatório</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333333;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .btn-submit {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Novo Relatório de Erro</h1>
        
        <form id="formRelatorio">
            <!-- Seleção de número de 1 a 40 -->
            <div class="form-group">
                <label for="numero">Selecione o Parquímetro:</label>
                <select id="numero" name="numero" required>
                    <option value="">Selecione...</option>
                    <!-- O JavaScript vai preencher de 1 a 40 automaticamente -->
                </select>
            </div>

            <!-- Seleção do tipo de erro -->
            <div class="form-group">
                <label for="tipoErro">Tipo de Erro:</label>
                <select id="tipoErro" name="tipoErro" required>
                    <option value="">Selecione o erro...</option>
                    
                    <!-- ========================================== -->
                    <!-- INÍCIO: ADICIONE SUAS OPÇÕES DE ERRO AQUI  -->
                    <!-- ========================================== -->
                    <option value="Porta Aberta">Porta Aberta (EE)</option>
                    <option value="Bateria Baixa">Bateria Baixa (EC)</option>
                    <option value="Problema na Impressora">Problema na Impressora (E0)</option>
                    <option value="Falta de Papel">Falta de Papel (E1)</option>
                    <option value="Erro Relógio">Erro no Relógio (E2)</option>
                    <option value="Coleta de Dados">Coleta de Dados (E3)</option>
                    <option value="Pré-Cofre Devolução">Problema na Devolução de moedas (E4)</option>
                    <option value="Pré-Cofre Recolhimento">Problema no Recolhimento de moedas (E5)</option>
                    <option value="Cofre Cheio">Capacidade Máxima do Cofre (E6)</option>
                    <option value="Cofre Aberto">Cofre Aberto ou Violado (E7)</option>
                    <option value="Cassete Ausente">Cassete de Moedas Ausente (E8)</option>
                    <option value="Sensor de Moedas">Travamento do Sensor de Moedas (E9)</option>
                    <option value="Cartão">Travamento no Sensor do Cartão (EA)</option>
                    <option value="Envio de Dados">Envio de Dados (ED)</option>
                    <!-- ========================================== -->
                    <!-- FIM DAS OPÇÕES DE ERRO                     -->
                    <!-- ========================================== -->
                    
                </select>
            </div>

            <button type="submit" class="btn-submit">Enviar Relatório</button>
        </form>

        <a href="index.html" class="back-link">Voltar ao Painel Inicial</a>
    </div>

    <script>
        // Preenche o campo select com números de 1 a 40 automaticamente
        const selectNumero = document.getElementById('numero');
        for (let i = 1; i <= 40; i++) {
            let option = document.createElement('option');
            option.value = i;
            option.textContent = i;
            selectNumero.appendChild(option);
        }

        // Evento ao enviar o formulário
        document.getElementById('formRelatorio').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita recarregar a página da forma padrão

            const numero = document.getElementById('numero').value;
            const tipoErro = document.getElementById('tipoErro').value;
            const dataHora = new Date().toLocaleString('pt-BR');

            // Cria o objeto do relatório
            const novoRelatorio = {
                numero: numero,
                tipoErro: tipoErro,
                data: dataHora
            };

            // Pega os relatórios já salvos no navegador (ou cria uma lista vazia)
            let relatorios = JSON.parse(localStorage.getItem('relatorios')) || [];
            
            // Adiciona o novo relatório no início da lista
            relatorios.unshift(novoRelatorio);

            // Salva de volta no LocalStorage
            localStorage.setItem('relatorios', JSON.stringify(relatorios));

            alert('Relatório enviado com sucesso!');
            
            // Redireciona para a página de ver os relatórios
            window.location.href = 'ver-relatorios.html';
        });
    </script>

</body>
</html>
